name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: awqaf-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://awqaf.my
    steps:
      - name: Check Laravel health endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --location --output /dev/null --silent --show-error --write-out '%{http_code}' --retry 2 --retry-delay 5 --retry-all-errors --max-time 90 "$BASE_URL/up")"
          echo "/up -> HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            exit 1
          fi

      - name: Check critical public routes
        shell: bash
        run: |
          set -euo pipefail
          for path in "/" "/agm" "/hubungi"; do
            code="$(curl --location --output /dev/null --silent --show-error --write-out '%{http_code}' --retry 2 --retry-delay 5 --retry-all-errors --max-time 90 "$BASE_URL$path")"
            echo "$path -> HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "Smoke check failed for $path"
              exit 1
            fi
          done
