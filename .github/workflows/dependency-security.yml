name: AWQAF Dependency Security Audit

on:
  pull_request:
    branches: [release/corporate-static-v1]
  push:
    branches: [release/corporate-static-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - name: Check committed PHP lockfile security
        run: composer audit --locked --no-interaction

  js-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check committed JavaScript lockfile security
        run: npm audit --audit-level=high
