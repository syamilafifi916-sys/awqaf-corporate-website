[phases.setup]
nixPkgs = ["php84", "php84Extensions.intl", "php84Extensions.zip", "php84Extensions.pdo_pgsql", "php84Extensions.mbstring", "php84Extensions.bcmath", "php84Extensions.gd", "php84Extensions.opcache", "nodejs_22", "npm-11_x"]

[phases.install]
cmds = [
  "composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction",
  "npm ci --ignore-scripts"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
